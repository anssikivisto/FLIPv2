const PKEY="et_std_progress", VKEY="et_std_voice", HKEY="et_std_matchhint";

function load(k,def){ try{ return {...def,...JSON.parse(localStorage.getItem(k)||"{}")}; }catch(e){ return {...def}; } }
function saveProg(){ localStorage.setItem(PKEY,JSON.stringify(prog)); }

function completeRound(topicId,task){ const today=new Date().toISOString().slice(0,10); if(prog.lastPlayDay!==today){ const y=new Date(Date.now()-864e5).toISOString().slice(0,10); prog.streak=prog.lastPlayDay===y?prog.streak+1:1; prog.lastPlayDay=today; } const key=topicId+":"+task; prog.completed[key]=(prog.completed[key]||0)+1; saveProg(); syncStickers(); }
function resetProgress(){ prog={stars:0,streak:0,lastPlayDay:null,completed:{},unlocked:[]}; saveProg(); }

let celebrateQueue=[];
let justUnlockedIds=[];

function syncStickers(){ 
  const earned=earnedStickerIds(); 
  const cur=prog.unlocked||[]; 
  const fresh=earned.filter(id=>!cur.includes(id)); 
  if(fresh.length){ 
    prog.unlocked=[...new Set([...cur,...earned])]; 
    saveProg(); 
    celebrateQueue.push(...fresh); 
    justUnlockedIds.push(...fresh);
    showMiniStickerToast(fresh[0]);
  } 
}

function showMiniStickerToast(stickerId){

}

/* ============================ AUDIO ============================ */
let _voices=[];
function loadVoices(){ if('speechSynthesis'in window) _voices=speechSynthesis.getVoices()||[]; }
if('speechSynthesis'in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function pickVoice(){ 
  if(!_voices.length)loadVoices(); 
  const target = voice.accent === "en-US" ? /en[-_]US/i : /en[-_]GB/i;
  const fallback = voice.accent === "en-US" ? /en[-_]GB/i : /en[-_]US/i;
  return _voices.find(v=>target.test(v.lang)) || _voices.find(v=>fallback.test(v.lang)) || _voices.find(v=>/^en/i.test(v.lang)) || null; 
}

function slugify(text) {
  return String(text).toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/(^_|_$)/g, '');
}

function speak(text, onEnd) {
  if (!text) {
    if (onEnd) setTimeout(onEnd, 200);
    return;
  }
  
  const acc = voice.accent || "en-GB";
  const url = 'audio/' + acc + '/' + slugify(text) + '.mp3';
  const audio = new Audio(url);
  
  audio.onended = () => { if (onEnd) onEnd(); };
  
  audio.onerror = () => {
    if (!('speechSynthesis' in window)) {
      if (onEnd) setTimeout(onEnd, 200);
      return;
    }
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      const v = pickVoice();
      if (v) u.voice = v;
      u.lang = v ? v.lang : "en-US";
      u.rate = Math.min(1.5, Math.max(0.5, voice.rate || 0.9));
      u.pitch = 1.08;
      if (onEnd) u.onend = onEnd;
      speechSynthesis.speak(u);
    } catch(e) {
      if (onEnd) setTimeout(onEnd, 200);
    }
  };
  
  audio.play().catch(e => audio.onerror());
}

async function playRecordedAudio(blobUrl) {
  if (!blobUrl) return;
  try {
    const resp = await fetch(blobUrl);
    const buf = await resp.arrayBuffer();
    const c = ac() || new (window.AudioContext || window.webkitAudioContext)();
    if (c.state === "suspended") await c.resume();
    const audioBuffer = await c.decodeAudioData(buf);
    const source = c.createBufferSource();
    source.buffer = audioBuffer;
    const gain = c.createGain();
    gain.gain.value = 2.8;
    source.connect(gain);
    gain.connect(c.destination);
    source.start(0);
  } catch(e) {
    new Audio(blobUrl).play();
  }
}

let _ctx=null;
function ac(){ try{ if(!_ctx)_ctx=new (window.AudioContext||window.webkitAudioContext)(); if(_ctx.state==="suspended")_ctx.resume(); return _ctx; }catch(e){ return null; } }
function tone(f,st,d,type,g){ const c=ac(); if(!c)return; const o=c.createOscillator(),ga=c.createGain(); o.type=type||"sine"; o.frequency.setValueAtTime(f,c.currentTime+st); ga.gain.setValueAtTime(1e-4,c.currentTime+st); ga.gain.exponentialRampToValueAtTime(g||0.18,c.currentTime+st+.02); ga.gain.exponentialRampToValueAtTime(1e-4,c.currentTime+st+d); o.connect(ga); ga.connect(c.destination); o.start(c.currentTime+st); o.stop(c.currentTime+st+d+.02); }
function playCorrect(){ tone(523.25,0,.16,"triangle"); tone(659.25,.12,.16,"triangle"); tone(783.99,.24,.28,"triangle"); }
function playTry(){ tone(392,0,.14,"sine",.38); tone(329.63,.1,.2,"sine",.38); }
function playStar(){ tone(659.25,0,.12,"square",.12); tone(783.99,.1,.12,"square",.12); tone(1046.5,.2,.32,"square",.12); }
function playBling(){ tone(1046.5,0,.1,"sine",.22); tone(1318.51,.08,.12,"sine",.22); tone(1567.98,.16,.24,"sine",.22); }

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function imgHTML(item,kind,size){ size=size||"72px";
